<div class="flex flex-col w-full h-full bg-card dark:bg-transparent rounded-lg overflow-hidden">
    
    <!-- Header -->
    <div class="flex items-center justify-between pl-8 pr-6 py-5 bg-gray-50 dark:bg-transparent border-b border-gray-200 dark:border-gray-800">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-teal-100 dark:bg-teal-500/20 text-teal-600 rounded-lg">
                <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:credit-card'"></mat-icon>
            </div>
            <div class="flex flex-col leading-none">
                <div class="text-xl font-bold text-gray-800 dark:text-gray-100">Bank Account Detail</div>
                <div class="text-xs font-semibold text-secondary uppercase tracking-wider mt-0.5">Contact Banking Information</div>
            </div>
        </div>
        <button mat-icon-button (click)="close()" type="button" class="text-gray-400">
            <mat-icon [svgIcon]="'heroicons_outline:x-mark'"></mat-icon>
        </button>
    </div>

    <!-- Content -->
    <form [formGroup]="bankAccountForm" class="p-8 space-y-8">
        
        <div class="grid grid-cols-1 gap-6">
            
            <!-- Account Name -->
            <div class="flex flex-col gap-1.5">
                <mat-label class="text-sm font-semibold text-gray-700 dark:text-gray-300 ml-1">Account Holder Name</mat-label>
                <mat-form-field class="fuse-mat-no-subscript" appearance="outline">
                    <input matInput formControlName="accountName" placeholder="e.g. John Doe">
                    <mat-icon matPrefix class="icon-size-5 mr-3 text-secondary" [svgIcon]="'heroicons_mini:user-circle'"></mat-icon>
                </mat-form-field>
            </div>

            <!-- Bank Name -->
            <div class="flex flex-col gap-1.5">
                <mat-label class="text-sm font-semibold text-gray-700 dark:text-gray-300 ml-1">Financial Institution (Bank Name)</mat-label>
                <mat-form-field class="fuse-mat-no-subscript" appearance="outline">
                    <input matInput formControlName="bankName" placeholder="e.g. Commonwealth Bank">
                    <mat-icon matPrefix class="icon-size-5 mr-3 text-secondary" [svgIcon]="'heroicons_mini:building-library'"></mat-icon>
                </mat-form-field>
            </div>

            <!-- BSB & Account Number Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- BSB -->
                <div class="flex flex-col gap-1.5">
                    <mat-label class="text-sm font-semibold text-gray-700 dark:text-gray-300 ml-1">BSB Code</mat-label>
                    <mat-form-field class="fuse-mat-no-subscript" appearance="outline">
                        <input matInput formControlName="bsb" placeholder="000-000">
                        <mat-icon matPrefix class="icon-size-5 mr-3 text-secondary" [svgIcon]="'heroicons_mini:hashtag'"></mat-icon>
                    </mat-form-field>
                </div>

                <!-- Account Number -->
                <div class="flex flex-col gap-1.5">
                    <mat-label class="text-sm font-semibold text-gray-700 dark:text-gray-300 ml-1">Account Number</mat-label>
                    <mat-form-field class="fuse-mat-no-subscript" appearance="outline">
                        <input matInput formControlName="accountNumber" placeholder="Account Number">
                        <mat-icon matPrefix class="icon-size-5 mr-3 text-secondary" [svgIcon]="'heroicons_mini:identification'"></mat-icon>
                    </mat-form-field>
                </div>
            </div>

        </div>
    </form>

    <!-- Footer -->
    <div class="flex items-center justify-end px-8 py-5 bg-gray-50 dark:bg-transparent border-t border-gray-200 dark:border-gray-800 gap-3">
        <button mat-button class="min-w-28 h-11 px-8 rounded-lg" (click)="close()">
            Cancel
        </button>
        <button mat-flat-button class="bg-teal-600 hover:bg-teal-700 text-white min-w-32 h-11 px-10 rounded-lg shadow-sm transition-colors" 
                (click)="save()" [disabled]="bankAccountForm.invalid">
            <mat-icon *ngIf="!data?.account" class="icon-size-5 mr-2" [svgIcon]="'heroicons_mini:plus'"></mat-icon>
            {{ data?.account ? 'Update Details' : 'Add Account' }}
        </button>
    </div>
</div>
